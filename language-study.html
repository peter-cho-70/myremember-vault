today?", "meaning": "", "extra": "예문 · hello", "spaced": "", "audio": "language-audio/2026-11-02/24a30a180568.mp3"}, {"id": "1302bf6391ba", "language": "en", "kind": "word", "text": "name", "meaning": "이름", "extra": "네임", "spaced": "", "audio": "language-audio/2026-11-02/1302bf6391ba.mp3"}, {"id": "dfa1d87f157d", "language": "en", "kind": "example", "text": "What's your name?", "meaning": "", "extra": "예문 · name", "spaced": "", "audio": "language-audio/2026-11-02/dfa1d87f157d.mp3"}, {"id": "ba042602b4a2", "language": "en", "kind": "word", "text": "meet", "meaning": "만나다", "extra": "미트", "spaced": "", "audio": "language-audio/2026-11-02/ba042602b4a2.mp3"}, {"id": "bf708486852a", "language": "en", "kind": "example", "text": "Nice to meet you.", "meaning": "", "extra": "예문 · meet", "spaced": "", "audio": "language-audio/2026-11-02/bf708486852a.mp3"}, {"id": "11a73ec3c7c1", "language": "en", "kind": "word", "text": "introduce", "meaning": "소개하다", "extra": "인트로듀스", "spaced": "", "audio": "language-audio/2026-11-02/11a73ec3c7c1.mp3"}, {"id": "f64507b58d6b", "language": "en", "kind": "example", "text": "Let me introduce myself.", "meaning": "", "extra": "예문 · introduce", "spaced": "", "audio": "language-audio/2026-11-02/f64507b58d6b.mp3"}, {"id": "c2bbdddbcf7f", "language": "en", "kind": "word", "text": "from", "meaning": "~출신의, ~에서 온", "extra": "프롬", "spaced": "", "audio": "language-audio/2026-11-02/c2bbdddbcf7f.mp3"}, {"id": "f35e54c5c883", "language": "en", "kind": "example", "text": "I'm from Korea.", "meaning": "", "extra": "예문 · from", "spaced": "", "audio": "language-audio/2026-11-02/f35e54c5c883.mp3"}, {"id": "1045da2b952f", "language": "en", "kind": "sentence", "text": "Hi, how are you?", "meaning": "안녕하세요, 어떻게 지내세요?", "extra": "", "spaced": "", "audio": "language-audio/2026-11-02/1045da2b952f.mp3"}, {"id": "bc82f576ce73", "language": "en", "kind": "sentence", "text": "My name is Peter.", "meaning": "제 이름은 피터예요.", "extra": "", "spaced": "", "audio": "language-audio/2026-11-02/bc82f576ce73.mp3"}, {"id": "df17224f4f66", "language": "en", "kind": "sentence", "text": "What do you do?", "meaning": "무슨 일을 하세요?", "extra": "", "spaced": "", "audio": "language-audio/2026-11-02/df17224f4f66.mp3"}, {"id": "763ee1912e78", "language": "ja", "kind": "word", "text": "こんにちは", "meaning": "안녕하세요", "extra": "konnichiwa (콘니치와)", "spaced": "", "audio": "language-audio/2026-11-02/763ee1912e78.mp3"}, {"id": "5c70761a8685", "language": "ja", "kind": "word", "text": "名前", "meaning": "이름", "extra": "namae (나마에)", "spaced": "", "audio": "language-audio/2026-11-02/5c70761a8685.mp3"}, {"id": "26596c02cd40", "language": "ja", "kind": "word", "text": "初めて", "meaning": "처음", "extra": "hajimete (하지메떼)", "spaced": "", "audio": "language-audio/2026-11-02/26596c02cd40.mp3"}, {"id": "5f51543f5ea4", "language": "ja", "kind": "word", "text": "会う", "meaning": "만나다", "extra": "au (아우)", "spaced": "", "audio": "language-audio/2026-11-02/5f51543f5ea4.mp3"}, {"id": "abf4cb43749d", "language": "ja", "kind": "word", "text": "私", "meaning": "저, 나", "extra": "watashi (와타시)", "spaced": "", "audio": "language-audio/2026-11-02/abf4cb43749d.mp3"}, {"id": "6008e9048848", "language": "ja", "kind": "sentence", "text": "はじめまして。", "meaning": "처음 뵙겠습니다.", "extra": "hajimemashite (하지메마시떼)", "spaced": "", "audio": "language-audio/2026-11-02/6008e9048848.mp3"}, {"id": "a184f9a99e83", "language": "ja", "kind": "sentence", "text": "私の名前は ピーター です。", "meaning": "제 이름은 피터입니다.", "extra": "watashi no namae wa Pītā desu (와타시노 나마에와 피타 데스)", "spaced": "", "audio": "language-audio/2026-11-02/a184f9a99e83.mp3"}, {"id": "f56955d2c7c5", "language": "ja", "kind": "sentence", "text": "お元気ですか？", "meaning": "잘 지내세요?", "extra": "o-genki desu ka (오겡끼데스까)", "spaced": "", "audio": "language-audio/2026-11-02/f56955d2c7c5.mp3"}, {"id": "86033e67c938", "language": "ja", "kind": "sentence", "text": "よろしくお願いします。", "meaning": "잘 부탁드립니다.", "extra": "yoroshiku onegaishimasu (요로시쿠 오네가이시마스)", "spaced": "", "audio": "language-audio/2026-11-02/86033e67c938.mp3"}, {"id": "e90ebdcd561b", "language": "ja", "kind": "sentence", "text": "どこから来ましたか？", "meaning": "어디서 오셨어요?", "extra": "doko kara kimashita ka (도코카라 키마시타카)", "spaced": "", "audio": "language-audio/2026-11-02/e90ebdcd561b.mp3"}, {"id": "27c171cf43a6", "language": "zh", "kind": "word", "text": "你好", "meaning": "안녕하세요", "extra": "nǐ hǎo", "spaced": "", "audio": "language-audio/2026-11-02/27c171cf43a6.mp3"}, {"id": "6ee6fb33f27d", "language": "zh", "kind": "word", "text": "名字", "meaning": "이름", "extra": "míngzi", "spaced": "", "audio": "language-audio/2026-11-02/6ee6fb33f27d.mp3"}, {"id": "aec2a6751f5c", "language": "zh", "kind": "word", "text": "认识", "meaning": "알다, (만나서) 알게 되다", "extra": "rènshi", "spaced": "", "audio": "language-audio/2026-11-02/aec2a6751f5c.mp3"}, {"id": "bb70ad401c29", "language": "zh", "kind": "word", "text": "高兴", "meaning": "기쁘다, 반갑다", "extra": "gāoxìng", "spaced": "", "audio": "language-audio/2026-11-02/bb70ad401c29.mp3"}, {"id": "5600e4c38890", "language": "zh", "kind": "word", "text": "哪", "meaning": "어느", "extra": "nǎ", "spaced": "", "audio": "language-audio/2026-11-02/5600e4c38890.mp3"}, {"id": "c3ff6439790e", "language": "zh", "kind": "sentence", "text": "你好，很高兴认识你。", "meaning": "안녕하세요, 만나서 반가워요.", "extra": "Nǐ hǎo, hěn gāoxìng rènshi nǐ.", "spaced": "", "audio": "language-audio/2026-11-02/c3ff6439790e.mp3"}, {"id": "921979fdc64f", "language": "zh", "kind": "sentence", "text": "我叫彼得。", "meaning": "제 이름은 피터예요.", "extra": "Wǒ jiào Bǐdé.", "spaced": "", "audio": "language-audio/2026-11-02/921979fdc64f.mp3"}, {"id": "f79d75071917", "language": "zh", "kind": "sentence", "text": "你叫什么名字？", "meaning": "이름이 뭐예요?", "extra": "Nǐ jiào shénme míngzi?", "spaced": "", "audio": "language-audio/2026-11-02/f79d75071917.mp3"}, {"id": "3f23566eb71c", "language": "zh", "kind": "sentence", "text": "你是哪国人？", "meaning": "어느 나라에서 오셨어요?", "extra": "Nǐ shì nǎ guó rén?", "spaced": "", "audio": "language-audio/2026-11-02/3f23566eb71c.mp3"}, {"id": "6e64b001f8d3", "language": "zh", "kind": "sentence", "text": "请多关照。", "meaning": "잘 부탁드립니다.", "extra": "Qǐng duō guānzhào.", "spaced": "", "audio": "language-audio/2026-11-02/6e64b001f8d3.mp3"}]}, {"date": "2026-11-01", "items": [{"id": "769d6168decc", "language": "en", "kind": "word", "text": "happy", "meaning": "행복한", "extra": "해피", "spaced": "", "audio": "language-audio/2026-11-01/769d6168decc.mp3"}, {"id": "26e7f3c5946f", "language": "en", "kind": "example", "text": "I feel happy today.", "meaning": "", "extra": "예문 · happy", "spaced": "", "audio": "language-audio/2026-11-01/26e7f3c5946f.mp3"}, {"id": "89c96f3ee6bd", "language": "en", "kind": "word", "text": "tired", "meaning": "피곤한", "extra": "타이어드", "spaced": "", "audio": "language-audio/2026-11-01/89c96f3ee6bd.mp3"}, {"id": "92308534ca68", "language": "en", "kind": "example", "text": "I'm so tired after work.", "meaning": "", "extra": "예문 · tired", "spaced": "", "audio": "language-audio/2026-11-01/92308534ca68.mp3"}, {"id": "74d5124016bd", "language": "en", "kind": "word", "text": "excited", "meaning": "신나는, 들뜬", "extra": "익사이티드", "spaced": "", "audio": "language-audio/2026-11-01/74d5124016bd.mp3"}, {"id": "78b2c1710715", "language": "en", "kind": "example", "text": "She's excited about the trip.", "meaning": "", "extra": "예문 · excited", "spaced": "", "audio": "language-audio/2026-11-01/78b2c1710715.mp3"}, {"id": "163a8c7450d0", "language": "en", "kind": "word", "text": "nervous", "meaning": "긴장되는", "extra": "너버스", "spaced": "", "audio": "language-audio/2026-11-01/163a8c7450d0.mp3"}, {"id": "2f18db7a54e2", "language": "en", "kind": "example", "text": "I'm nervous about the interview.", "meaning": "", "extra": "예문 · nervous", "spaced": "", "audio": "language-audio/2026-11-01/2f18db7a54e2.mp3"}, {"id": "75031937e209", "language": "en", "kind": "word", "text": "relieved", "meaning": "안심되는", "extra": "릴리브드", "spaced": "", "audio": "language-audio/2026-11-01/75031937e209.mp3"}, {"id": "a79579589c18", "language": "en", "kind": "example", "text": "I felt relieved when I heard the news.", "meaning": "", "extra": "예문 · relieved", "spaced": "", "audio": "language-audio/2026-11-01/a79579589c18.mp3"}, {"id": "08b074564073", "language": "en", "kind": "sentence", "text": "How are you feeling today?", "meaning": "오늘 기분 어때요?", "extra": "", "spaced": "", "audio": "language-audio/2026-11-01/08b074564073.mp3"}, {"id": "4d667728d867", "language": "en", "kind": "sentence", "text": "I'm doing okay, thanks.", "meaning": "저는 괜찮아요, 고마워요.", "extra": "", "spaced": "", "audio": "language-audio/2026-11-01/4d667728d867.mp3"}, {"id": "94afd0d34d17", "language": "en", "kind": "sentence", "text": "I'm feeling a bit down.", "meaning": "기분이 좀 안 좋아요.", "extra": "", "spaced": "", "audio": "language-audio/2026-11-01/94afd0d34d17.mp3"}, {"id": "f175d1a42bab", "language": "en", "kind": "sentence", "text": "That makes me so happy!", "meaning": "그거 정말 기쁘네요!", "extra": "", "spaced": "", "audio": "language-audio/2026-11-01/f175d1a42bab.mp3"}, {"id": "e673c698f4ab", "language": "en", "kind": "sentence", "text": "Don't worry, it'll be fine.", "meaning": "걱정 마세요, 잘 될 거예요.", "extra": "", "spaced": "", "audio": "language-audio/2026-11-01/e673c698f4ab.mp3"}, {"id": "39423db03dd8", "language": "ja", "kind": "word", "text": "嬉しい (うれしい)", "meaning": "기쁘다", "extra": "ureshii", "spaced": "", "audio": "language-audio/2026-11-01/39423db03dd8.mp3"}, {"id": "54f5d1d74eac", "language": "ja", "kind": "word", "text": "悲しい (かなしい)", "meaning": "슬프다", "extra": "kanashii", "spaced": "", "audio": "language-audio/2026-11-01/54f5d1d74eac.mp3"}, {"id": "9cb54869fa42", "language": "ja", "kind": "word", "text": "疲れた (つかれた)", "meaning": "피곤하다", "extra": "tsukareta", "spaced": "", "audio": "language-audio/2026-11-01/9cb54869fa42.mp3"}, {"id": "5ed5987dbd3a", "language": "ja", "kind": "word", "text": "楽しい (たのしい)", "meaning": "즐겁다", "extra": "tanoshii", "spaced": "", "audio": "language-audio/2026-11-01/5ed5987dbd3a.mp3 味", "meaning": "취미", "extra": "しゅみ (shumi)", "spaced": "", "audio": "language-audio/2026-10-30/dcf5e911b810.mp3"}, {"id": "89f9f315a0f4", "language": "ja", "kind": "word", "text": "読書", "meaning": "독서", "extra": "どくしょ (dokusho)", "spaced": "", "audio": "language-audio/2026-10-30/89f9f315a0f4.mp3"}, {"id": "673634e8b7ba", "language": "ja", "kind": "sentence", "text": "今日はいい天気ですね。", "meaning": "오늘 날씨 좋네요.", "extra": "きょうはいいてんきですね (kyou wa ii tenki desune)", "spaced": "今日 は いい 天気 です ね。", "audio": "language-audio/2026-10-30/673634e8b7ba.mp3"}, {"id": "1ec6a973416b", "language": "ja", "kind": "sentence", "text": "明日は雨が降るそうです。", "meaning": "내일 비가 온다고 해요.", "extra": "あしたはあめがふるそうです (ashita wa ame ga furu sou desu)", "spaced": "明日 は 雨 が 降る そう です。", "audio": "language-audio/2026-10-30/1ec6a973416b.mp3"}, {"id": "fda0007370c4", "language": "ja", "kind": "sentence", "text": "趣味は何ですか。", "meaning": "취미가 뭐예요?", "extra": "しゅみはなんですか (shumi wa nan desuka)", "spaced": "趣味 は 何 です か。", "audio": "language-audio/2026-10-30/fda0007370c4.mp3"}, {"id": "8b69f55bf6b1", "language": "ja", "kind": "sentence", "text": "私の趣味は映画を見ることです。", "meaning": "제 취미는 영화 보는 거예요.", "extra": "わたしのしゅみはえいがをみることです (watashi no shumi wa eiga wo miru koto desu)", "spaced": "私 の 趣味 は 映画 を 見る こと です。", "audio": "language-audio/2026-10-30/8b69f55bf6b1.mp3"}, {"id": "06114fa94763", "language": "ja", "kind": "sentence", "text": "散歩するのが好きです。", "meaning": "산책하는 걸 좋아해요.", "extra": "さんぽするのがすきです (sanpo suru no ga suki desu)", "spaced": "散歩 する の が 好き です。", "audio": "language-audio/2026-10-30/06114fa94763.mp3"}, {"id": "fa02d566a49e", "language": "zh", "kind": "word", "text": "天气", "meaning": "날씨", "extra": "tiānqì", "spaced": "", "audio": "language-audio/2026-10-30/fa02d566a49e.mp3"}, {"id": "568f1ac8e3f7", "language": "zh", "kind": "word", "text": "下雨", "meaning": "비가 오다", "extra": "xiàyǔ", "spaced": "", "audio": "language-audio/2026-10-30/568f1ac8e3f7.mp3"}, {"id": "9f7fc452178b", "language": "zh", "kind": "word", "text": "晴天",
